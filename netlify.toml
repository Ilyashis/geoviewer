[build]
  command = "npm run build"
  publish = "dist"

# Client-side app: serve index.html for any path (safe even without routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed asset filenames — cache them immutably.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
