# Typecheck + tests + build on every PR and on main. Until this existed the
# only automated check was Vercel's deploy, which proves the Vite build
# compiles and nothing else — the 400+ vitest suite (including the
# architecture-layering guard) only ran on a developer's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
